site_name: Enterprise Knowledge Agent
site_description: Cross-source reasoning over six SaaS surfaces, with auditable governance and a self-authored eval.
site_url: https://huangf06.github.io/enterprise-knowledge-agent/
repo_url: https://github.com/huangf06/enterprise-knowledge-agent
repo_name: huangf06/enterprise-knowledge-agent
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Architecture:
      - System overview: architecture.md
      - Governance design: governance-design.md
      - Failure modes: failure-modes.md
      - Eval methodology: eval-methodology.md
  - Frontier ablations:
      - Self-Refine (Madaan 2023): frontier3_self_refine.md
      - DSPy compilation: sprint4_dspy_result.md
      - DSPy agent-level ablation: sprint4_dspy_agent_ablation.md
      - MoE synthesize Pareto: sprint5_moe_pareto.md
      - Counterfactual robustness: sprint6_counterfactual_result.md
  - Benchmarks:
      - HotpotQA full-agent: hotpotqa_agent_result.md
      - Adversarial governance (W5 report): w5_report.md
  - Deploy:
      - Fly.io: deploy.md
      - Azure Container Apps: deploy-azure.md
      - HR Helpdesk case study: case-study-hr-helpdesk.md
