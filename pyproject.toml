[project]
name = "enterprise-knowledge-agent"
version = "0.1.0"
description = "Production-grade multi-tool agent over cross-source private enterprise data with self-authored eval and governance layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-anthropic>=0.2",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "gradio>=4.44",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.0",
    "faker>=30.0",
    "numpy>=2.0",
    "pydantic>=2.9",
    "datasets>=3.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "ragas>=0.4.3",
    "dspy>=2.5",
    "rank-bm25>=0.2.2",
    "cohere>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
