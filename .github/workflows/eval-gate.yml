name: eval-gate
on:
  pull_request:
    branches: [main]

jobs:
  eval-subset:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ secrets.DEEPSEEK_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv==0.11.8
      - name: Install deps
        run: uv sync --extra dev
      - name: Generate synthetic data
        run: uv run python scripts/generate_data.py --seed 42 --output data/synthetic
      - name: Run 20-scenario subset
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          LLM_MODEL: deepseek-v4-pro[1m]
        run: uv run python scripts/run_eval.py --limit 20
      - name: Run adversarial scenarios
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          LLM_MODEL: deepseek-v4-pro[1m]
        run: uv run python scripts/run_adversarial.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval_results/
