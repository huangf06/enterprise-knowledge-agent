name: eval-nightly
on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:

jobs:
  full-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: ${{ secrets.DEEPSEEK_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv==0.11.8
      - name: Install deps
        run: uv sync --extra dev
      - name: Generate synthetic data
        run: uv run python scripts/generate_data.py --seed 42 --output data/synthetic
      - name: Full 30-scenario eval
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          LLM_MODEL: deepseek-v4-pro[1m]
        run: uv run python scripts/run_eval.py
      - name: HotpotQA + MS Marco retrieval sanity
        run: uv run python scripts/run_retrieval_sanity.py
      - name: Upload nightly results
        uses: actions/upload-artifact@v4
        with:
          name: eval-nightly-results
          path: eval_results/
