name: eval-nightly

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch:

jobs:
  full-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Check DeepSeek key
        id: gate
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::warning::DEEPSEEK_API_KEY not configured in repo secrets; skipping nightly eval."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.has_key == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.has_key == 'true'
        with:
          python-version: "3.11"
      - name: Install uv
        if: steps.gate.outputs.has_key == 'true'
        run: pip install uv==0.11.8
      - name: Install deps
        if: steps.gate.outputs.has_key == 'true'
        run: uv sync --extra dev
      - name: Generate synthetic data
        if: steps.gate.outputs.has_key == 'true'
        run: uv run python scripts/generate_data.py --seed 42 --output data/synthetic
      - name: Full 30-scenario eval
        if: steps.gate.outputs.has_key == 'true'
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          LLM_MODEL: deepseek-v4-pro[1m]
        run: uv run python scripts/run_eval.py
      - name: HotpotQA + MS Marco retrieval sanity
        if: steps.gate.outputs.has_key == 'true'
        run: uv run python scripts/run_retrieval_sanity.py
      - name: Upload nightly results
        if: steps.gate.outputs.has_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-nightly-results
          path: eval_results/
