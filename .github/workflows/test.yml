name: tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv==0.11.8
      - name: Install deps
        run: uv sync --extra dev
      - name: Generate synthetic data
        run: uv run python scripts/generate_data.py --seed 42 --output data/synthetic
      - name: Run unit tests (skips retrieval tests that need Qdrant)
        run: uv run pytest tests/ --ignore=tests/retrieval -v
