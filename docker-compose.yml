services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: eka-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: eka-postgres
    environment:
      POSTGRES_USER: eka
      POSTGRES_PASSWORD: eka_dev
      POSTGRES_DB: eka_audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile
    container_name: eka-api
    depends_on:
      - qdrant
      - postgres
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-pro[1m]}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_data:
