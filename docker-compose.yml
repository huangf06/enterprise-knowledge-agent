services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: eka-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: eka-postgres
    environment:
      POSTGRES_USER: eka
      POSTGRES_PASSWORD: eka_dev
      POSTGRES_DB: eka_audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_data:
