# Fly.io deployment config. Lives at repo root because that is what
# `fly deploy` reads by default. Source of truth; infra/fly.toml is a
# mirror kept around for the deploy-checklist documentation reference.

app = "enterprise-knowledge-agent"
primary_region = "ams"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "infra/Dockerfile"

[env]
  ANTHROPIC_BASE_URL = "https://api.deepseek.com/anthropic"
  LLM_MODEL = "deepseek-v4-pro[1m]"
  SELF_REFINE_ENABLED = "0"
  USE_COMPILED_PROMPTS = "0"
  # Qdrant is not used by the /query runtime (only by offline indexing scripts).

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  type = "http"
  interval = "30s"
  timeout = "5s"
  grace_period = "30s"
  method = "get"
  path = "/health"

[processes]
  app = "uv run uvicorn src.api.main:api --host 0.0.0.0 --port 8000"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
